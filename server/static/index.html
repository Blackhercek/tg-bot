<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Дневной баланс</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1C1A17">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/css/fonts.css">
<link rel="stylesheet" href="/static/css/base.css">
</head>
<body>
<main class="shell">
  <h1 class="disp" style="font-size:28px;margin-bottom:2px">Дневной баланс</h1>
  <p style="margin:0 0 20px;color:var(--muted);font-size:13.5px">
    Данные хранятся на сервере — переживают смену браузера и телефона.
  </p>
  <div style="display:flex;flex-direction:column;gap:10px">
    <a class="tile" href="/app/nutrition">
      <span style="font-size:26px" aria-hidden="true">⚖️</span>
      <span>
        <span class="disp" style="font-size:19px;display:block">Питание</span>
        <span style="font-size:12.5px;color:var(--muted)">Сессии, шаги, КБЖУ, тренд веса</span>
      </span>
    </a>
    <a class="tile" href="/app/tracker">
      <span style="font-size:26px" aria-hidden="true">🏋️</span>
      <span>
        <span class="disp" style="font-size:19px;display:block">Тренировки</span>
        <span style="font-size:12.5px;color:var(--muted)">Сеты, утренние метрики, прогрессия</span>
      </span>
    </a>
    <a class="tile" href="/app/guide">
      <span style="font-size:26px" aria-hidden="true">📏</span>
      <span>
        <span class="disp" style="font-size:19px;display:block">Как мерить</span>
        <span style="font-size:12.5px;color:var(--muted)">Точки дельт и талии, схемы, пороги</span>
      </span>
    </a>
  </div>
  <div class="card" style="margin-top:14px;padding:15px 18px">
    <div class="eyebrow" style="margin-bottom:6px">Состояние</div>
    <div class="num" id="st" style="font-size:12.5px;color:var(--muted)">проверяю…</div>
  </div>
</main>
<footer class="foot">
  <a href="#" id="out">Выйти</a>
</footer>
<script>
fetch("/api/health",{credentials:"same-origin"}).then(function(r){return r.json()}).then(function(j){
  var d=j.docs||{}, out=[];
  [["nutrition","питание"],["tracker","тренировки"]].forEach(function(p){
    var x=d[p[0]];
    out.push(x ? p[1]+": версия "+x.rev+", "+x.updated_at.replace("T"," ").replace("+00:00"," UTC")
               : p[1]+": пока пусто");
  });
  document.getElementById("st").innerHTML=out.join("<br>");
}).catch(function(){document.getElementById("st").textContent="сервер не отвечает"});
document.getElementById("out").addEventListener("click",function(e){
  e.preventDefault();
  fetch("/api/logout",{method:"POST",credentials:"same-origin"}).then(function(){location.href="/login"});
});
if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(function(){});
</script>
</body>
</html>
